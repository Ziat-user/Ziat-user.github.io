<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | minigame</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #111;
      }

      body {
        box-sizing: border-box;

        /*
          ここで画面全体の余白を指定します。
          数字を大きくすると余白が広がります。
        */
        padding: 40px;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      #unity-container {
        position: relative;

        /*
          Canvas全体の最大幅です。
          1280pxなどにすると1920pxより小さく表示できます。
        */
        width: min(100%, 1280px);

        /*
          16:9を維持します。
          Unity側が1920x1080なので 16 / 9 が自然です。
        */
        aspect-ratio: 16 / 9;

        background: #000;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        border-radius: 16px;
        overflow: hidden;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }

      #unity-warning {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        z-index: 10;
      }

      #unity-footer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
      }

      /*
        スマホでは余白を少し狭くします。
      */
      @media (max-width: 768px) {
        body {
          padding: 16px;
          align-items: flex-start;
        }

        #unity-container {
          width: 100%;
          border-radius: 12px;
        }
      }
    </style>
  </head>

  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">minigame</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");

        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type == "error") {
          div.style = "background: red; padding: 10px;";
        } else {
          if (type == "warning") {
            div.style = "background: yellow; padding: 10px;";
          }

          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }

        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/build_.loader.js";

      var config = {
        arguments: [],
        dataUrl: buildUrl + "/build_.data",
        frameworkUrl: buildUrl + "/build_.framework.js",
        codeUrl: buildUrl + "/build_.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "minigame",
        productVersion: "1.0",
        showBanner: unityShowBanner
      };

      /*
        Unity WebGLの描画サイズは通常CanvasのDOMサイズに追従します。
        今回はCSS側でCanvasサイズを管理するので、
        JSで canvas.style.width = "1920px" のように固定しません。
      */

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);

        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        /*
          スマホで重い場合は有効化してください。
          config.devicePixelRatio = 1;
        */
      } else {
        document.querySelector("#unity-container").className = "unity-desktop";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width =
            100 * progress + "%";
        })
          .then((unityInstance) => {
            e";

            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          })
          .catch((message) => {
            alert(message);
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
